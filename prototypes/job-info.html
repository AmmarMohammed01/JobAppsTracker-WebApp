<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobApps: Job Info</title>

    <style>
        .navbar {
            display: block;
            border-style: solid;
            margin-bottom: 10px;
            
            background-color: azure;
        }
        .navbar-item {
            display: inline-block;
        }

        .job-content {
            display: block;
            border-style: solid;
            background-color: antiquewhite;
            padding: 20px;
        }

        .job-head {
            font-family: 'Times New Roman';
            font-size: 40px;

            margin-bottom: 20px;
        }

        .job-title,
        .job-company {
            display: inline-block;
        }

        .job-body {
            font-family: 'Gill Sans';
            font-size: 20px;
        }

        .job-status-container {
            display: inline-block;

            background-color: azure;

            margin: 10px 0px;

            /* margin: 10px 20px 30px 40px; */
            /* north, east, south, west. CLOCKWISE*/

            /* margin: 10px 20px; */
            /* north & south, east & west. CLOCKWISE */
        }

        table, th {
            border: solid 3px;
            border-spacing: 0;
            border-collapse: collapse;
        }

        th {
            font-weight: 600;
            padding: 5px;
        }

        td {
            border-right: solid 3px;
            padding: 5px;
        }

    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-item">JobApps</div>
        <div class="navbar-item">User #1</div>
        <button class="navbar-item">Log Out</button>
    </div>

    <div class="job-content">
        <div class="job-head">
            <div class="job-title">Data Labeler</div>
            <div style="display: inline-block;">&#183;</div>
            <div class="job-company">Tesla</div>
        </div>
        <div class="job-body">
            <div>Resume: Software Engineering</div>
            <div>Platform: Indeed</div>
            <div class="job-status-container">
                <!-- <div>Status Table</div> -->
                <table>
                    <thead>
                        <tr>
                            <th>Status Type</th>
                            <th>Status Time</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Applied</td>
                            <td>2026-10-28</td>
                        </tr>
                        <tr>
                            <td>Rejected</td>
                            <td>2026-10-31</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div>
                <p>URLs</p>
                <ul>
                    <li>url1.com</li>
                    <li>url2.com</li>
                </ul>
                <form method="post">
                    <input type="text" name="" id="new-url">
                    <input type="submit" value="add">
                </form>
            </div>
        </div>
    </div>
</body>
</html>
