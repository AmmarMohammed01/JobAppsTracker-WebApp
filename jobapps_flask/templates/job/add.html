<!DOCTYPE html>
<html>
    <head>
        <title>JobApps - Job: Add</title>
    </head>
    <body>
        <p>JobApps - Add Job</p>
        <form method="post">
            <!-- Company name, job title, website link, status datetime, resume name, platform name -->
            <label for="companyName">Company Name</label>
            <input id="companyName" name="company" type="text">
            <br>

            <label for="jobTitle">Job Title</label>
            <input id="jobTitle" name="job" type="text">
            <br>

            <label for="websiteLink">Website Link</label>
            <input id="websiteLink" name="link" type="text">
            <br>

            <label for="appliedDatetime">Applied Datetime</label>
            <input id="appliedDatetime" name="applied_time" type="datetime-local">
            <br>

            <label for="resumeName">Resume Name</label>
            <input id="resumeName" name="resume" type="text">
            <br>

            <label for="platformName">Platform Name</label>
            <input id="platformName" name="platform" type="text">
            <br>

            <input type="submit">

        </form>
    </body>
</html>
